plugins {
    id "com.android.application"
}

android {
    namespace "com.voicenoter.keyboard"
    compileSdk 35

    defaultConfig {
        applicationId "com.voicenoter.keyboard"
        minSdk 23
        targetSdk 35
        versionCode 18
        versionName "0.3.12"
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "Voice-Keyboard-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
